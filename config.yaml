    min_level: 10
  warnings:
    min_level: 5 
  del_warnings:
    min_level: 20
  timeout:
    min_level: 10
  untimeout:
    min_level: 10
  clear:
    min_level: 10
  kick:
    min_level: 20
  ban:
    min_level: 20
